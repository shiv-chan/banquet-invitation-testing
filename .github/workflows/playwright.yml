name: Run Playwright Tests

on:
  push:
    branches:
      - main
      - ci
  repository_dispatch:
    types: [app-updated]

jobs:
    run-playwright-tests:
      timeout-minutes: 60
      runs-on: ubuntu-latest
      steps:
        - name: Pull the latest image from Docker Hub
          run: |
            docker pull ${{ vars.DOCKERHUB_USERNAME }}/banquet:latest

        - name: Start the application locally
          run: |
            docker container run -d \
            --name banquet-app \
            -p 127.0.0.1:3000:3000 \
            -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
            -e ALLOW_DB_RESET=${{ secrets.ALLOW_DB_RESET }} \
            -e TEST_SECRET=${{ secrets.TEST_SECRET }} \
            ${{ vars.DOCKERHUB_USERNAME }}/banquet

        - name: Wait for app
          run: npx wait-on http://localhost:3000

        - name: Checkout repository
          uses: actions/checkout@v2

        - name: Set up Node.js
          uses: actions/setup-node@v7
          with:
            node-version: lts/*

        - name: Install dependencies
          run: npm ci

        - name: Install Playwright browsers
          run: npx playwright install --with-deps

        - name: Run Playwright tests
          run: |
            npx playwright test --project=chromium \
            npx playwright test --project=firefox \
            npx playwright test --project=webkit

        - name: Upload Playwright reports
          uses: actions/upload-artifact@v4
          if: ${{ always() }}
          with:
            name: execution-reports
            path: execution-reports/
            retention-days: 90

        - name: Collect Docker logs
          if: ${{ failure() }}
          run: docker logs banquet-app > docker.log

        - name: Upload Docker logs
          uses: actions/upload-artifact@v4
          if: ${{ failure() }}
          with:
            name: docker-logs
            path: docker.log


        - name: Stop the application
          if: ${{ always() }}
          run: docker container stop banquet-app